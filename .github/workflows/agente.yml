# Modo momentum (por defecto):
# - Selección de valores a vigilar antes de la apertura (con Claude, una consulta al día).
# - Operador cada 10 minutos durante la sesión de EE. UU.: stops dinámicos y entradas (sin IA, coste 0).
# - Pasada nocturna tras el cierre (estado y stops).
# El diario (carpeta datos/) se guarda en la rama "datos" del repositorio.
name: Agente diario

on:
  # Proyecto en pausa: sin ejecuciones programadas. Solo se ejecuta a mano (botón "Run workflow").
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano (también desde el móvil)
    inputs:
      modo:
        description: "Qué ejecutar"
        type: choice
        options: [operar, bucle-hasta-cierre, seleccionar, estado, resumen-diario, resumen-semanal, backtest-momentum, auditoria, laboratorio, probar-claude, reiniciar-simulado, reactivar, completo, sin-ia]
        default: operar
      parametros:
        description: "Opciones extra para backtest-momentum (p. ej. --comparar --dias 120)"
        required: false
        default: ""

permissions:
  actions: write   # para lanzar la segunda parte de la sesión (GitHub corta cada ejecución a las 6 h)
  contents: write  # para guardar el diario en la rama "datos"
  issues: write    # para publicar los resúmenes

concurrency:
  # nunca dos ejecuciones del agente a la vez; los backtests van aparte (no tocan el diario)
  group: ${{ (inputs.modo == 'backtest-momentum' || inputs.modo == 'auditoria' || inputs.modo == 'laboratorio') && 'backtest' || 'agente' }}
  cancel-in-progress: false

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHub no permite más de 6 h por ejecución; la sesión dura 6,5 h y se parte en dos
    env:
      PYTHONUNBUFFERED: "1"  # que el registro se vea en directo en Actions
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      BROKER: ${{ vars.BROKER || 'simulado' }}
      ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
      # Sin nadie al teclado: si CONFIRMAR_ORDENES es true, las órdenes se proponen pero NO se ejecutan
      CONFIRMAR_ORDENES: ${{ vars.CONFIRMAR_ORDENES || 'false' }}
      MAX_GASTO_IA_MES: ${{ vars.MAX_GASTO_IA_MES || '2' }}
      NUCLEO_SIMBOLO: ${{ vars.NUCLEO_SIMBOLO }}
      NUCLEO_PCT: ${{ vars.NUCLEO_PCT || '0.6' }}
      SIMBOLOS_PERMITIDOS: ${{ vars.SIMBOLOS_PERMITIDOS || 'QQQ,VTI,AAPL,MSFT' }}
      MODO: ${{ vars.MODO || 'momentum' }}
      UNIVERSO: ${{ vars.UNIVERSO }}
      # Configuración agresiva (backtest 60 días: +13,7 % frente a +8 % de comprar y mantener)
      TRAILING_PCT: ${{ vars.TRAILING_PCT || '2' }}
      MAX_POSICIONES: ${{ vars.MAX_POSICIONES || '5' }}
      PCT_POR_POSICION: ${{ vars.PCT_POR_POSICION || '0.2' }}
      MINUTOS_VELA: ${{ vars.MINUTOS_VELA || '5' }}
      BARRAS_RUPTURA: ${{ vars.BARRAS_RUPTURA || '12' }}
      VOLUMEN_MINIMO: ${{ vars.VOLUMEN_MINIMO || '1.2' }}
      CAPITAL_SIMULADO: ${{ vars.CAPITAL_SIMULADO || '2000' }}
      # Mejoras "de trader": solo las que aprobó el backtest comparativo (85 sesiones, las dos mitades).
      # Filtro de mercado: +9,9 % frente a +3,0 % sin él. Las demás empeoraban el resultado.
      FILTRO_MERCADO: ${{ vars.FILTRO_MERCADO || 'true' }}
      STOP_ATR: ${{ vars.STOP_ATR || '0' }}
      EVITAR_APERTURA_MIN: ${{ vars.EVITAR_APERTURA_MIN || '0' }}
      EVITAR_CIERRE_MIN: ${{ vars.EVITAR_CIERRE_MIN || '0' }}
      PARCIAL_PCT: ${{ vars.PARCIAL_PCT || '0' }}
      CERRAR_AL_CIERRE: ${{ vars.CERRAR_AL_CIERRE || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar el diario (rama datos)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" datos >/dev/null; then
            git clone --quiet --branch datos --single-branch "$URL" datos
          else
            mkdir datos && git -C datos init --quiet -b datos && git -C datos remote add origin "$URL"
          fi

      - name: Ejecutar el agente
        run: |
          set -o pipefail  # si el agente falla, la ejecución sale en rojo (y GitHub avisa por email)
          ACCION="${{ inputs.modo || 'completo' }}"
          case "${{ github.event.schedule }}" in
            "15 13 * * 1-5")      ACCION="seleccionar" ;;
            "*/5 13-20 * * 1-5") ACCION="operar" ;;
          esac
          case "$ACCION" in
            sin-ia) CMD="agente.main --sin-ia" ;;
            operar) CMD="agente.main --operar" ;;
            bucle-hasta-cierre) CMD="agente.main --bucle --segundos 120 --hasta-cierre --max-minutos 330" ;;
            seleccionar) CMD="agente.main --seleccionar" ;;
            estado) CMD="agente.main --estado" ;;
            probar-claude) CMD="agente.main --probar-claude" ;;
            reiniciar-simulado) CMD="agente.main --reiniciar-simulado" ;;
            reactivar) CMD="agente.main --reactivar" ;;
            backtest-momentum) CMD="agente.backtest_momentum ${{ inputs.parametros }}" ;;
            laboratorio) CMD="agente.laboratorio ${{ inputs.parametros }}" ;;
            auditoria) CMD="agente.auditoria datos/operaciones.csv datos/decisiones.jsonl" ;;
            resumen-diario|resumen-semanal) CMD="agente.main --estado" ;;
            *) CMD="agente.main" ;;
          esac
          python -m $CMD < /dev/null | tee salida.txt
          echo "" >> salida.txt
          python -m agente.main --estado < /dev/null >> salida.txt
          { echo '### Resultado del agente'; echo '```'; cat salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resumen (diario; los viernes también el semanal)
        if: github.event.schedule == '40 21 * * 1-5' || inputs.modo == 'resumen-diario' || inputs.modo == 'resumen-semanal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python -m agente.resumen --diario < /dev/null > resumen.md
          if [ "$(date -u +%u)" = "5" ] || [ "${{ inputs.modo }}" = "resumen-semanal" ]; then
            { echo; echo '---'; echo; python -m agente.resumen --semanal < /dev/null; } >> resumen.md
          fi
          printf '\n@%s\n' "${{ github.repository_owner }}" >> resumen.md
          cat resumen.md >> "$GITHUB_STEP_SUMMARY"
          NUM=$(gh issue list --label resumen-agente --state open --json number --jq '.[0].number')
          if [ -z "$NUM" ]; then
            gh label create resumen-agente --color 1D76DB --description "Resúmenes del agente" 2>/dev/null || true
            URL=$(gh issue create --title "📊 Resúmenes del agente" --label resumen-agente \
              --body "Aquí se publican el resumen diario (tras el cierre) y la revisión semanal (viernes).")
            NUM="${URL##*/}"
          fi
          gh issue comment "$NUM" --body-file resumen.md

      - name: Guardar el diario
        if: always() && inputs.modo != 'backtest-momentum' && inputs.modo != 'auditoria' && inputs.modo != 'laboratorio'
        run: |
          cd datos
          git config user.name "agente-trading"
          git config user.email "agente-trading@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit --quiet -m "Diario $(date -u +%F)"
          if git rev-parse --verify --quiet HEAD >/dev/null; then git push --quiet origin datos; fi

      - name: Continuar la sesión en otra ejecución (si el mercado sigue abierto)
        if: always() && hashFiles('continuar') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agente.yml --ref "${GITHUB_REF_NAME}" -f modo=bucle-hasta-cierre
